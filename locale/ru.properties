map_battle_editor/valid=Запись корректна. Сохраните или запустите проверку.
map_battle_editor/saved=Встречи сохранены; игра перечитает данные.
map_battle_editor/hint=Выберите свою запись, создайте новую или измените чужую патчем.
map_battle_editor/delete_confirm=Удалить выбранную встречу? Это можно отменить.
map_battle_editor/error/data=Проверьте id, неотрицательную награду и незавершённые поля. Ничего не сохранено.
map_battle_editor/error/files=Не удалось прочитать файл встреч. Исправьте его перед сохранением.
map_battle_editor/error/map=Выберите доступную карту размером от 1×1 до 128×128.
map_battle_editor/error/abilities=Проверьте id приёмов, назначение участникам и границы дальности.
map_battle_editor/error/action=Нужно действие ToEnemy с формулой урона и положительной ценой ОД; без состояний, маны и пробивания.
map_battle_editor/error/units=Каждому бойцу нужны уникальный id, персонаж, приём и допустимые запасы ОД/шагов.
map_battle_editor/error/cell=Клетка вне карты, занята другим бойцом или непроходима. Исправьте X/Y или выберите клетку кликом.
map_battle_editor/error/assigned=Выбранный приём не назначен персонажу. Добавьте действие в редакторе персонажей.
map_battle_editor/error/roster=Связь с отрядом допустима только для игрока; один член отряда — один боец.
map_battle_editor/error/sides=Нужны 1–2 бойца игрока и 1–20 противников.
map_battle_editor/error/metadata=Стены видимости или укрытия содержат клетку вне карты.
map_battle_editor/error/targets=Цель победы должна быть врагом, защищаемый боец — игроком; оба id должны существовать.
map_battle_editor/error/test_context=Нужна запущенная 2D-игра и сцена выбранной карты, без другого боя или проверки.
map_battle_editor/error/test_start=Проверка не началась: проверьте карту, живых членов отряда и назначенные им действия. Исходная игра восстановлена.
