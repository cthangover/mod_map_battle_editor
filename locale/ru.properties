map_battle_editor/local_id_hint=Постоянный локальный id создаётся автоматически; ссылки встречи используют именно его.
map_battle_editor/test=Запустить проверку боя
map_battle_editor/test_hint=Настоящий бой на выбранной карте. F8 / Остановить возвращает исходную игру без потери здоровья, опыта и наград. Документ сохраняется отдельно.
map_battle_editor/testing=Проверка встречи
